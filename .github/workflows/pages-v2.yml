name: Deploy GitHub Pages v2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v2"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full image-question site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public

          # Keep the currently deployed stable app as the base, then add the
          # current repo's bank/image layers. The final Pages artifact is fully
          # self-contained; reference images are copied into public/images.
          curl -LfsS --retry 4 --retry-delay 2 "https://idlolz.github.io/-motorboat-quiz/?bootstrap=${GITHUB_SHA}" -o public/index.html
          cp bank-addon.js public/bank-addon.js
          cp image-addon.js public/image-addon.js

          python3 build-images.py --site public/index.html --out public

          python3 - <<'PY'
          from pathlib import Path
          import os,re

          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')

          # Remove any addon tags inherited from the previous deployed page so
          # every build gets exactly one fresh copy of each layer.
          for name in ('bank-addon','image-addon','image-map'):
              s=re.sub(
                  rf'<script[^>]+src=["\'][^"\']*{re.escape(name)}\.js[^"\']*["\'][^>]*></script>',
                  '',
                  s,
                  flags=re.I,
              )

          # Permanently remove the legacy focus-card feature while keeping the
          # 57 real image questions and online question bank untouched.
          s=s.replace('<button data-menu="cards">重點圖卡</button>','')
          s=s.replace(
              '<div class="modalMask" id="modalMask"><div class="modal"><h2>重點圖卡</h2><div class="cards" id="cards"></div><button class="closeModal" id="closeModal">關閉</button></div></div>',
              '',
          )
          s=re.sub(r'\n?const IMAGE_CARDS=\[\];\n?', '\n', s)
          s=re.sub(
              r"function showCards\(\)\{document\.getElementById\('cards'\)\.innerHTML=IMAGE_CARDS\.map\(x=>`.*?`\)\.join\(''\);document\.getElementById\('modalMask'\)\.classList\.add\('show'\)\}\s*",
              '',
              s,
              flags=re.S,
          )
          s=s.replace(
              "document.getElementById('closeModal').onclick=()=>document.getElementById('modalMask').classList.remove('show');document.getElementById('modalMask').onclick=e=>{if(e.target.id==='modalMask')e.currentTarget.classList.remove('show')};",
              '',
          )
          s=s.replace("if(x==='cards')showCards();",'')
          s=re.sub(
              r"\.modalMask\{[^}]*\}\.modalMask\.show\{[^}]*\}\.modal\{[^}]*\}\.modal h2\{[^}]*\}\.cards\{[^}]*\}\.studyImg\{[^}]*\}\.imgTitle\{[^}]*\}\.closeModal\{[^}]*\}",
              '',
              s,
          )

          for marker in ('重點圖卡','IMAGE_CARDS','showCards','closeModal','modalMask','data-menu="cards"'):
              if marker in s:
                  raise SystemExit(f'focus-card feature marker still present: {marker}')

          if '</body>' not in s.lower():
              raise SystemExit('body close tag missing')

          sha=os.environ.get('GITHUB_SHA','images')
          tags=(
              f'<script src="image-map.js?v={sha}"></script>'
              f'<script src="bank-addon.js?v={sha}"></script>'
              f'<script src="image-addon.js?v={sha}"></script>'
          )
          i=s.lower().rfind('</body>')
          s=s[:i]+tags+s[i:]
          p.write_text(s,encoding='utf-8')
          PY

          # Stable-app checks.
          test $(wc -c < public/index.html) -gt 200000
          grep -Fq "ziuulehcejtpkjjmwyxi.supabase.co/functions/v1/quiz-sync" public/index.html
          grep -Fq "motorboat_quiz_v3" public/index.html
          if grep -Fq 'data-start="mechanical"' public/index.html; then
            echo "mechanical mode unexpectedly present"
            exit 1
          fi

          # Verify that the complete 819-question bank remains intact.
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('public/index.html').read_text(encoding='utf-8')
          m=re.search(r'(?:const|let|var)\s+QUESTION_BANK\s*=\s*',s)
          if not m:
              raise SystemExit('QUESTION_BANK missing after build')
          bank,_=json.JSONDecoder().raw_decode(s[m.end():])
          if len(bank)!=819:
              raise SystemExit(f'QUESTION_BANK has {len(bank)} questions, expected 819')
          ids={str(q.get('id')) for q in bank}
          for expected in ('2-1-1','2-2-27','6-3-30','7-1-20'):
              if expected not in ids:
                  raise SystemExit(f'restored image question missing: {expected}')
          PY

          # Online-bank checks.
          grep -Fq "線上題庫" public/bank-addon.js
          grep -Fq "正確答案" public/bank-addon.js
          grep -Fq "BANK_PAGE_SIZE=40" public/bank-addon.js
          grep -Fq "data-question-id" public/bank-addon.js

          # Full image-question checks: 40 question images + 17 option-image
          # questions = 57 image questions and 104 unique JPEG assets.
          grep -Fq '"finalQuestions":819' public/image-map.js
          grep -Fq '"imageQuestions":57' public/image-map.js
          grep -Fq '"directQuestions":40' public/image-map.js
          grep -Fq '"optionQuestions":17' public/image-map.js
          grep -Fq '"uniqueImages":104' public/image-map.js
          test "$(find public/images -type f -name '*.jpg' | wc -l)" -eq 104
          test -s public/image-build-stats.json

          # Syntax checks for every JavaScript layer plus the stable site's
          # inline app code after removing the focus-card feature.
          node --check public/image-map.js
          node --check public/bank-addon.js
          node --check public/image-addon.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('inline script block missing')
          Path('/tmp/site-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site-inline.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
