name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cat clean01.dat clean02.dat clean03.dat clean04.dat clean05.dat clean06.dat clean07.dat clean08.dat clean09.dat clean10.dat clean11.dat clean12.dat \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/site.gz
          gzip -t /tmp/site.gz
          gzip -dc /tmp/site.gz > public/index.html

          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          old = "const q=state.questions[state.index], chosen=state.answers[q.id]; const show=state.review||state.submitted; const correct=chosen===q.answer;"
          new = "const q=state.questions[state.index], chosen=state.answers[q.id]; const show=state.submitted||(state.review&&!!chosen); const correct=chosen===q.answer;"
          if old not in s:
              raise SystemExit('practice answer-visibility target not found')
          s = s.replace(old, new, 1)

          mech_helper = "function isMechanical(q){return q.chapter.startsWith('五、')}\n"
          mech_logic = "  if(kind==='mechanical'){pool=QUESTION_BANK.filter(isMechanical);n=50;title='機械加強';review=true}\n"
          mech_button = '  <button class="mode mecha" data-start="mechanical"><strong>機械加強 50 題</strong><span>只抽「船機常識」：內燃機、操作運轉、維修故障。</span></button>\n'
          mech_css = ".mode.mecha{border-color:#f3c37a;background:#fff9ef}"
          for target, label in [(mech_helper,'helper'),(mech_logic,'logic'),(mech_button,'button'),(mech_css,'css')]:
              if target not in s:
                  raise SystemExit('mechanical removal target missing: '+label)
              s = s.replace(target, '', 1)
          restore_old = "function restoreSession(){\n  const a=store.active;\n"
          restore_new = "function restoreSession(){\n  const a=store.active;\n  if(a&&a.mode==='mechanical'){store.active=null;saveStore();toast('機械加強模式已移除');render();return}\n"
          if restore_old not in s:
              raise SystemExit('restore session target missing')
          s = s.replace(restore_old, restore_new, 1)

          cloud = r'''
          (()=>{
          const CLOUD_SYNC_URL='https://ziuulehcejtpkjjmwyxi.supabase.co/functions/v1/quiz-sync';
          let cloudReady=false, cloudApplying=false, cloudTimer=null;
          let cloudStatus={state:'busy',text:'正在連接雲端…'};

          function validSyncId(id){return /^[a-z0-9-]{20,80}$/i.test(String(id||'').trim())}
          function setSyncStatus(stateName,text){
            cloudStatus={state:stateName,text};
            const el=document.querySelector('.syncBadge');
            if(!el)return;
            el.id='syncStatus';
            const dot=el.querySelector('.syncDot');
            if(dot)dot.style.background=stateName==='ok'?'#42ad6b':stateName==='error'?'#d75a4a':stateName==='offline'?'#9aa8af':'#f0a34a';
            const span=el.querySelector('[data-cloud-text]')||document.createElement('span');
            span.setAttribute('data-cloud-text','1');
            span.textContent=text;
            if(!span.parentNode)el.appendChild(span);
            [...el.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.remove());
          }
          function enhanceCloudUi(){
            const panel=document.querySelector('.profilePanel');
            if(!panel)return;
            const title=panel.querySelector('.profileMeta b');
            if(title)title.textContent='同步資料 ID（請勿公開）';
            const hero=document.querySelector('.hero p');
            if(hero)hero.textContent='每個瀏覽器會自動建立獨立的匿名同步資料 ID；答題紀錄互不混用，並會同步到雲端。';
            const badge=panel.querySelector('.syncBadge');
            if(badge){
              badge.innerHTML='<span class="syncDot"></span><span data-cloud-text></span>';
              setSyncStatus(cloudStatus.state,cloudStatus.text);
            }
            const copy=document.getElementById('copyIdBtn');
            if(copy)copy.textContent='複製同步 ID';
            if(!document.getElementById('restoreIdBtn')){
              const btn=document.createElement('button');
              btn.id='restoreIdBtn';btn.className='copyIdBtn';btn.textContent='使用既有 ID';
              btn.style.marginLeft='8px';
              btn.onclick=useExistingSyncId;
              if(copy&&copy.parentNode)copy.parentNode.appendChild(btn);
            }
          }
          function useExistingSyncId(){
            const entered=prompt('貼上原本裝置的同步資料 ID。這組 ID 等同進度恢復碼，請勿公開。','');
            if(entered===null)return;
            const id=entered.trim();
            if(!validSyncId(id)){toast('同步資料 ID 格式不正確');return}
            if(id===DEVICE_ID){toast('目前已經使用這組資料 ID');return}
            try{
              localStorage.setItem(DEVICE_ID_KEY,id);
              const target='motorboat_quiz_v3:'+id;
              if(!localStorage.getItem(target)){
                localStorage.setItem(target,JSON.stringify({wrong:[],history:[],stats:{},active:null,createdAt:new Date().toISOString(),updatedAt:null}));
              }
              location.reload();
            }catch(e){toast('無法切換同步資料 ID')}
          }
          function normalizeCloudStore(x){
            x=x&&typeof x==='object'&&!Array.isArray(x)?x:{};
            const y=Object.assign({},DEFAULT_STORE,x,{stats:x.stats||{},wrong:x.wrong||[],history:x.history||[],active:x.active||null});
            if(!y.createdAt)y.createdAt=new Date().toISOString();
            return y;
          }
          function tv(x){const n=Date.parse(x||'');return Number.isFinite(n)?n:0}
          async function cloudRequest(payload){
            const c=new AbortController(), tm=setTimeout(()=>c.abort(),7000);
            try{
              const r=await fetch(CLOUD_SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json','X-Device-Token':DEVICE_ID},body:JSON.stringify(payload),cache:'no-store',signal:c.signal});
              const data=await r.json().catch(()=>({}));
              if(!r.ok)throw new Error(data.error||('HTTP '+r.status));
              return data;
            }finally{clearTimeout(tm)}
          }
          async function cloudSaveNow(){
            if(!navigator.onLine){setSyncStatus('offline','離線中，資料先存在此裝置');return false}
            setSyncStatus('busy','同步中…');
            try{
              const x=await cloudRequest({action:'save',state:store});
              cloudReady=true;setSyncStatus('ok','已同步到雲端');return !!x.ok;
            }catch(e){cloudReady=true;setSyncStatus('error','雲端同步暫時失敗，本機資料仍已保存');return false}
          }
          function scheduleCloudSave(){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSaveNow,700)}
          const originalSaveStore=saveStore;
          saveStore=function(){
            const ok=originalSaveStore();
            if(ok&&cloudReady&&!cloudApplying)scheduleCloudSave();
            return ok;
          };
          const originalRender=render;
          render=function(){originalRender();enhanceCloudUi()};
          enhanceCloudUi();

          async function initCloudSync(){
            setSyncStatus('busy','正在連接雲端…');
            if(!navigator.onLine){cloudReady=true;setSyncStatus('offline','離線中，資料先存在此裝置');return}
            try{
              const remote=await cloudRequest({action:'load'});
              cloudReady=true;
              if(remote.found&&remote.state){
                const rstate=normalizeCloudStore(remote.state);
                const rt=Math.max(tv(remote.updated_at),tv(rstate.updatedAt)), lt=tv(store.updatedAt);
                if(rt>lt){
                  cloudApplying=true;store=rstate;
                  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
                  cloudApplying=false;
                  setSyncStatus('ok','已從雲端恢復最新進度');
                  if(state.screen==='home')render();
                }else await cloudSaveNow();
              }else{
                if(!store.updatedAt){
                  store.updatedAt=new Date().toISOString();
                  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
                }
                await cloudSaveNow();
              }
            }catch(e){cloudReady=true;setSyncStatus('error','無法連接雲端，本機資料仍可正常使用')}
          }
          window.addEventListener('online',()=>cloudSaveNow());
          window.addEventListener('offline',()=>setSyncStatus('offline','離線中，資料先存在此裝置'));
          initCloudSync();
          })();
          '''
          if '</body>' not in s:
              raise SystemExit('body close tag missing')
          s = s.replace('</body>', '<script>\n'+cloud+'\n</script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

          test $(wc -c < public/index.html) -gt 250000
          grep -Fq "const LETTERS=['A','B','C','D'];" public/index.html
          grep -Fq "const CHAPTERS=[...new Set(QUESTION_BANK.map(q=>q.chapter))];" public/index.html
          grep -Fq "const show=state.submitted||(state.review&&!!chosen);" public/index.html
          grep -Fq "ziuulehcejtpkjjmwyxi.supabase.co/functions/v1/quiz-sync" public/index.html
          grep -Fq "使用既有 ID" public/index.html
          grep -Fq "線上題庫" public/index.html
          grep -Fq "BANK_PAGE_SIZE=40" public/index.html
          grep -Fq "function renderBank()" public/index.html
          if grep -Fq "const show=state.review||state.submitted;" public/index.html; then
            echo "old answer-reveal logic still present"
            exit 1
          fi
          if grep -Fq "data-start=\"mechanical\"" public/index.html; then
            echo "mechanical mode button still present"
            exit 1
          fi
          if grep -Fq "kind==='mechanical'" public/index.html; then
            echo "mechanical mode logic still present"
            exit 1
          fi
          grep -q "motorboat_quiz_v3" public/index.html
          grep -q "</html>" public/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          if not scripts:
              raise SystemExit('script block missing')
          Path('/tmp/site.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
