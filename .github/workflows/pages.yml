name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cat quiz01.dat quiz02.dat quiz03.dat quiz04.dat quiz05.dat quiz06.dat quiz07.dat quiz08.dat \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/site.gz
          set +e
          gzip -dc /tmp/site.gz > public/index.html
          GZIP_STATUS=$?
          set -e
          SIZE=$(wc -c < public/index.html)
          echo "gzip status: $GZIP_STATUS; built $SIZE bytes"
          test "$SIZE" -gt 250000
          grep -q "motorboat_quiz_v2" public/index.html
          grep -q "</html>" public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
