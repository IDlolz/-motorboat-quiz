name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cat quiz01.dat quiz02.dat quiz03.dat quiz04.dat quiz05.dat quiz06.dat quiz07.dat quiz08.dat \
            | tr -d '\r\n\t ' \
            | base64 --decode > /tmp/site.gz
          gzip -t /tmp/site.gz
          gzip -dc /tmp/site.gz > public/index.html
          test $(wc -c < public/index.html) -gt 250000
          grep -Fq "const LETTERS=['A','B','C','D'];" public/index.html
          grep -Fq "const CHAPTERS=[...new Set(QUESTION_BANK.map(q=>q.chapter))];" public/index.html
          grep -q "motorboat_quiz_v2" public/index.html
          grep -q "</html>" public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/site.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
