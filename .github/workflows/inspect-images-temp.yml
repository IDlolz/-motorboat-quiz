name: Inspect official image source temp

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect official pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect
          curl -LfsS --retry 3 --retry-delay 2 'https://www.motorboatdrivertest.com/business/rules/index.html' -o inspect/rules.html
          curl -LfsS --retry 3 --retry-delay 2 'https://www.motorboatdrivertest.com/business/exam/index.html' -o inspect/exam.html
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          out=Path('inspect')
          report={}
          for name in ('rules.html','exam.html'):
              p=out/name
              s=p.read_text(encoding='utf-8',errors='replace')
              report[name]={
                  'bytes':p.stat().st_size,
                  'data_webp':s.count('data:image/webp;base64,'),
                  'data_png':s.count('data:image/png;base64,'),
                  'question_text_pos':s.find('如下圖兩艘迎艏接近動力船'),
                  'id_pos':s.find('2-1-1'),
              }
              for key in ('如下圖兩艘迎艏接近動力船','2-1-1','data:image/webp;base64,'):
                  pos=s.find(key)
                  text='NOT FOUND' if pos<0 else s[max(0,pos-2500):pos+6000]
                  (out/f'{name}.{key[:8].replace("/","_")}.txt').write_text(text,encoding='utf-8')
              assets=sorted(set(re.findall(r'''[^"' <>()]+\.(?:png|jpe?g|gif|webp|js|json)(?:\?[^"' <>()]*)?''',s,re.I)))
              (out/f'{name}.assets.txt').write_text('\n'.join(assets),encoding='utf-8')
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-image-source-temp
          path: inspect
          retention-days: 1
