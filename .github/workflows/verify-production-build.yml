name: Verify production image build

on:
  push:
    branches: ["deploy-image-full"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build without deploying
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          curl -LfsS --retry 4 --retry-delay 2 'https://idlolz.github.io/-motorboat-quiz/?verify=image-full' -o public/index.html
          cp bank-addon.js public/bank-addon.js
          cp image-addon.js public/image-addon.js
          python3 build-images.py --site public/index.html --out public

          grep -Fq '"imageQuestions":57' public/image-map.js
          grep -Fq '"directQuestions":40' public/image-map.js
          grep -Fq '"optionQuestions":17' public/image-map.js
          grep -Fq '"uniqueImages":104' public/image-map.js
          test "$(find public/images -type f -name '*.jpg' | wc -l)" -eq 104
          node --check public/image-map.js
          node --check public/bank-addon.js
          node --check public/image-addon.js
          cat public/image-build-stats.json
